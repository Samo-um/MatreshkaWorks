<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#050505;color:#fff;overflow:hidden}
header{display:flex;justify-content:space-between;padding:12px 16px;background:#000;font-size:13px;font-weight:800;position:relative;z-index:2}
header span{color:#ff1a1a}
.director{font-size:9px;text-align:right;color:#ff1a1a;line-height:1.2}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .8s}
#splash.hide{opacity:0;pointer-events:none}
.s-logo{width:200px;animation:logoAnim 2.2s ease-in-out infinite}
@keyframes logoAnim{0%{transform:scale(.85);filter:drop-shadow(0 0 10px #ff0000)}50%{transform:scale(1.08);filter:drop-shadow(0 0 35px #ff0000)}100%{transform:scale(.85);filter:drop-shadow(0 0 10px #ff0000)}}
.s-text{margin-top:18px;font-weight:900;letter-spacing:2px;font-size:20px}
.s-text span{color:#ff1a1a}
.s-load{width:120px;height:2px;background:#222;margin-top:16px;border-radius:2px;overflow:hidden}
.s-bar{height:100%;width:0%;background:#ff1a1a;animation:load 2.5s forwards}
@keyframes load{to{width:100%}}
.wrap{max-width:420px;margin:0 auto;padding:0 14px 40px;position:relative;z-index:1}
.top-logo{width:160px;margin:18px auto 8px;display:block;filter:drop-shadow(0 0 15px rgba(255,0,0,.6))}
.card{background:#121212;border:1px solid #222;border-radius:14px;padding:16px;margin-top:12px}
.title{text-align:center;font-size:17px;font-weight:700}.title b{color:#ff1a1a}
.label{font-size:10px;color:#777;margin:12px 0 4px}
.inp{width:100%;padding:12px;background:#080808;border:1px solid #2a2a2a;border-radius:8px;color:#fff}
.btn{width:100%;margin-top:14px;padding:12px;background:linear-gradient(90deg,#ff1a1a,#a00000);border:0;border-radius:8px;color:#fff;font-weight:800;cursor:pointer}
.greet{text-align:center;font-size:21px;margin:14px 0}
.menu-btn{width:100%;background:#181818;border:1px solid #222;border-radius:12px;padding:16px;margin-top:10px;text-align:center;font-weight:700;cursor:pointer}
.menu-btn:first-child{background:#2a0a0a;border-color:#ff1a1a}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:99;padding:14px}
.modal{background:#121212;border:1px solid #ff1a1a;border-radius:14px;width:100%;max-width:400px;overflow:hidden}
.modal-head{background:#ff1a1a;padding:10px 14px;display:flex;justify-content:space-between;font-weight:800}
.modal-body{padding:14px} textarea{width:100%;min-height:80px;background:#080808;border:1px solid #2a2a2a;border-radius:8px;color:#fff;padding:10px}
.hidden{display:none!important}
.flex-show{display:flex!important}
#soundBtn{position:fixed;bottom:14px;right:14px;background:#ff1a1a;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;z-index:5;cursor:pointer}
</style>
</head>
<body>

<div id="splash">
<img src="logo.png" class="s-logo" alt="logo">
<div class="s-text">GROUND <span>RUSSIA</span></div>
<div class="s-load"><div class="s-bar"></div></div>
<div style="font-size:10px;color:#555;margin-top:8px">MatreshkaWorks</div>
</div>

<header><div>GROUND <span>RUSSIA</span></div><div class="director">Director:<br>Samo_Monopoly<br>Arsen_Samsonyan</div></header>

<div class="wrap">
<img class="top-logo" src="logo.png" alt="logo">
<div id="loginBox">
<div class="card">
<div class="title">Добро Пожаловать на форум<br><b>Ground Russia!</b></div>
<div class="label">Никнейм</div>
<input id="nick" class="inp" placeholder="Введите ник" value="Same-Jan">
<div class="label">Пароль</div>
<input id="pass" type="password" class="inp" placeholder="Введите пароль">
<button class="btn" onclick="doLogin()">ВОЙТИ</button>
<div style="text-align:center;font-size:10px;color:#666;margin-top:8px">Связь: <a href="https://t.me/shayar01" style="color:#ff1a1a;text-decoration:none">@hayar01</a></div>
</div>
</div>
<div id="menuBox" class="hidden">
<div class="greet">Привет, <b id="uName" style="color:#ff1a1a">Same-Jan</b>!</div>
<div class="menu-btn" onclick="alert('APK скоро будет!')">1. 📦 СКАЧАТЬ APK</div>
<div class="menu-btn" onclick="openModal('Задать вопрос')">2. 💬 Задать вопрос</div>
<div class="menu-btn" onclick="openModal('Жалоба')">3. 🚨 Жалоба</div>
<div class="menu-btn" onclick="openModal('Запрос на обновление')">4. 🚀 Запрос на обновление</div>
<div style="text-align:center;margin-top:16px"><button onclick="logout()" style="background:#222;border:0;color:#aaa;padding:8px 20px;border-radius:20px;cursor:pointer">← Выйти</button></div>
</div>
</div>

<div id="soundBtn" onclick="toggleMusic()">🔊</div>

<div id="modalBg" class="modal-bg" onclick="if(event.target==this)closeModal()">
<div class="modal">
<div class="modal-head"><span id="modalTitle">Вопрос</span><span onclick="closeModal()" style="cursor:pointer">X</span></div>
<div class="modal-body">
<input id="mNick" class="inp" style="margin-bottom:8px">
<textarea id="mText" placeholder="Напиши сообщение..."></textarea>
<button class="btn" onclick="sendTG()">ОТПРАВИТЬ В ТЕЛЕГРАМ</button>
</div>
</div>
</div>

<audio id="bgMusic" loop preload="auto" playsinline>
<source src="oyrobinya.mp3" type="audio/mpeg">
<source src="./oyrobinya.mp3" type="audio/mpeg">
</audio>

<script>
const audio=document.getElementById('bgMusic');
const splash=document.getElementById('splash');
const loginBox=document.getElementById('loginBox');
const menuBox=document.getElementById('menuBox');
let isPlaying=false;

// 1. АНИМАЦИЯ ЛОГО 2.5 сек потом показываем сайт
setTimeout(()=>{ splash.classList.add('hide'); document.body.style.overflow='auto'; tryAutoPlay(); },2500);

function tryAutoPlay(){
  audio.volume=0.6;
  audio.play().then(()=>{isPlaying=true;}).catch(()=>{
    // если браузер блокирует - включаем по первому тапу
    document.addEventListener('click', firstPlay, {once:true});
    document.addEventListener('touchstart', firstPlay, {once:true});
  });
}
function firstPlay(){ audio.play().then(()=>{isPlaying=true;}); }

function doLogin(){
  const n=document.getElementById('nick').value.trim()||'Same-Jan';
  if(!document.getElementById('pass').value.trim()){document.getElementById('pass').style.borderColor='#ff1a1a';return;}
  localStorage.setItem('gr_nick',n);
  document.getElementById('uName').textContent=n;
  document.getElementById('mNick').value=n;
  loginBox.classList.add('hidden'); menuBox.classList.remove('hidden');
  if(!isPlaying){ audio.play().catch(()=>{}); }
}
function logout(){localStorage.removeItem('gr_nick'); location.reload();}
function openModal(t){document.getElementById('modalTitle').textContent=t; document.getElementById('modalBg').classList.add('flex-show');}
function closeModal(){document.getElementById('modalBg').classList.remove('flex-show');}
function sendTG(){
  const txt=document.getElementById('mText').value.trim();
  if(!txt){alert('Напиши сообщение!');return;}
  const msg=`[${document.getElementById('modalTitle').textContent}] от ${document.getElementById('mNick').value}: ${txt}`;
  window.open('https://t.me/shayar01?text='+encodeURIComponent(msg),'_blank');
  closeModal();
}
function toggleMusic(){
  if(audio.paused){audio.play(); document.getElementById('soundBtn').textContent='🔊';}
  else{audio.pause(); document.getElementById('soundBtn').textContent='🔇';}
}

// НЕ СТАВИТЬ НА ПАУЗУ КОГДА СВЕРНУЛ - вот фикс
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && isPlaying){ audio.play().catch(()=>{}); }
});
// чтобы не останавливалась когда свернул
audio.addEventListener('pause', ()=>{
  if(isPlaying && !audio.ended && document.hidden){ 
    setTimeout(()=>audio.play().catch(()=>{}), 300);
  }
});
</script>
</body>
  </html>
