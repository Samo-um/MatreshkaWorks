<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial}
body{background:#000;color:#fff;overflow:hidden}
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#logo{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;opacity:0;transition:1s}
#logo.show{opacity:1}
header{position:fixed;top:0;left:0;right:0;z-index:10;height:58px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:rgba(8,8,8,.96)}
.wrap{max-width:430px;margin:0 auto;padding:80px 16px}
.card{background:#212121;border:1px solid #2e2e2e;border-radius:24px;padding:24px;margin-top:20px}
.btn{width:100%;padding:17px;background:linear-gradient(90deg,#ff6a00,#ff1a1a);border:0;border-radius:14px;color:#fff;font-weight:900;cursor:pointer}
.hidden{display:none!important}
.inp{width:100%;padding:16px;background:#080808;border:1px solid #2f2f2f;border-radius:13px;color:#fff;outline:none}
</style>
</head>
<body>

<div id="splash">
  <video id="video" autoplay loop playsinline preload="auto">
    <source src="halloween.mp4" type="video/mp4">
  </video>
  <div id="logo"><img src="logo.png" style="width:330px;max-width:85vw;filter:drop-shadow(0 0 15px #ff6a00)"><div style="margin-top:12px;font-size:12px;letter-spacing:2px">🎃 God is always with you 🕸️</div></div>
</div>

<header><div>GROUND <span style="color:#ff1e00">RUSSIA</span></div><div style="font-size:10px;text-align:right">🎃 Arsen_Samsonyan<br>🕸️ Samo_Monopoly</div></header>

<div class="wrap">
  <div id="loginBox"><div class="card"><input id="nick" class="inp" placeholder="Nick_Name"><button class="btn" style="margin-top:14px" onclick="enter()">ВОЙТИ</button></div></div>
  <div id="menuBox" class="hidden"><div class="card" style="text-align:center">Привет, <b id="name" style="color:#ff1a1a"></b>! 🎃</div></div>
</div>

<script>
const v = document.getElementById('video');

// СТАРТ: звук 34% с первой секунды, бесконечно
function start(){
  v.volume = 0.34;
  v.muted = false;
  v.loop = true;
  v.currentTime = 0;
  v.play().catch(()=>{
    v.muted = true;
    v.play().then(()=>{
      setTimeout(()=>{ v.muted=false; v.volume=0.34; v.play(); }, 200);
    });
  });
}

window.addEventListener('load', start);
document.addEventListener('click', start);
document.addEventListener('touchstart', start);

// СВЕРНУЛ - пауза, РАЗВЕРНУЛ - продолжает
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    v.pause();
  } else {
    v.muted = false;
    v.volume = 0.34;
    v.play().catch(()=>{});
  }
});

setTimeout(()=>document.getElementById('logo').classList.add('show'), 6000);
setTimeout(()=>{
  document.getElementById('splash').style.transform="translateY(-100%)";
  document.getElementById('splash').style.transition="transform 1.2s ease";
  document.body.style.overflow='auto';
}, 9500);

function enter(){
  start();
  const n = document.getElementById('nick').value.trim() || 'Игрок';
  document.getElementById('name').textContent = n;
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('menuBox').classList.remove('hidden');
}
</script>
</body>
</html>
