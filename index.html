<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black,Arial}
body{background:#000;color:#fff;overflow:hidden}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;overflow:hidden;transition:transform 1s cubic-bezier(.8,0,.2,1), opacity 1s}
#splash.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
.kremlin-bg{position:absolute;inset:0;background:
radial-gradient(circle at 20% 80%, rgba(255,106,0,.4) 0%, transparent 50%),
radial-gradient(circle at 80% 20%, rgba(0,255,120,.35) 0%, transparent 50%),
radial-gradient(circle at 50% 50%, rgba(255,0,0,.25) 0%, transparent 70%),
linear-gradient(180deg,#000 0%, #0a0a0a 100%);
}
.kremlin-sil{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:110%;height:55%;opacity:.18;filter:blur(1px) brightness(1.5);background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300"><path d="M0 300 L0 200 L20 180 L40 200 L60 150 L80 180 L100 120 L120 140 L140 100 L160 140 L200 80 L240 140 L260 100 L280 140 L320 80 L360 140 L400 100 L440 140 L480 80 L520 140 L560 100 L600 140 L640 80 L680 140 L700 100 L720 140 L760 80 L800 140 L840 100 L860 140 L880 120 L900 180 L920 150 L940 200 L960 180 L1000 200 L1000 300 Z" fill="%23ff6a00"/></svg>') no-repeat bottom / cover; animation:kFloat 6s ease-in-out infinite}
@keyframes kFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-12px)}}
.particles{position:absolute;inset:0;pointer-events:none}
.particles i{position:absolute;width:3px;height:3px;background:var(--c);border-radius:50%;animation:fly 8s linear infinite;box-shadow:0 0 8px var(--c)}
@keyframes fly{0%{transform:translateY(110vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(100px) scale(1.5);opacity:0}}
.s-logo-wrap{position:relative;z-index:2;animation:logoIn 1.2s cubic-bezier(.2,1.5,.5,1) forwards}
.s-logo{width:320px;max-width:85vw;filter:drop-shadow(0 0 25px rgba(255,0,0,.9)) drop-shadow(0 0 60px rgba(255,106,0,.6));animation:logoPulse 2s ease-in-out infinite}
@keyframes logoIn{0%{transform:scale(.2) rotate(-15deg);opacity:0;filter:blur(20px)}100%{transform:scale(1) rotate(0);opacity:1;filter:blur(0)}}
@keyframes logoPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 25px #ff0000) drop-shadow(0 0 60px #ff6a00)}50%{transform:scale(1.04);filter:drop-shadow(0 0 40px #ff0000) drop-shadow(0 0 90px #00ff88)}}
.s-text{position:relative;z-index:2;margin-top:22px;font-size:26px;letter-spacing:3px;text-align:center;animation:textIn .8s .6s both}
.s-text span{color:#ff1a1a;text-shadow:0 0 20px #ff0000, 0 0 40px #ff6a00}
@keyframes textIn{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
.s-load{position:relative;z-index:2;width:180px;height:3px;background:rgba(255,255,255,.1);margin-top:20px;border-radius:10px;overflow:hidden}
.s-bar{height:100%;width:0%;background:linear-gradient(90deg,#ff6a00,#ff0000,#00ff88);box-shadow:0 0 10px #ff6a00;animation:load 2.6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes load{to{width:100%}}
.wrap{max-width:420px;margin:0 auto;padding:0 14px 40px;position:relative;z-index:1}
header{display:flex;justify-content:space-between;padding:12px 16px;background:rgba(0,0,0,.9);font-size:13px;font-weight:800;border-bottom:1px solid #1a1a1a}
header span{color:#ff1a1a}
.card{background:#121212;border:1px solid #222;border-radius:14px;padding:16px;margin-top:12px;box-shadow:0 0 30px rgba(0,0,0,.8)}
.btn{width:100%;margin-top:14px;padding:14px;background:linear-gradient(90deg,#ff6a00,#ff1a1a);border:0;border-radius:10px;color:#fff;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 0 20px rgba(255,26,26,.5)}
.inp{width:100%;padding:12px;background:#080808;border:1px solid #2a2a2a;border-radius:8px;color:#fff}
.label{font-size:10px;color:#777;margin:12px 0 4px}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="splash">
<div class="kremlin-bg"></div>
<div class="kremlin-sil"></div>
<div class="particles" id="particles"></div>
<div class="s-logo-wrap">
<img src="logo.png" class="s-logo" alt="GROUND RUSSIA">
</div>
<div class="s-text">GROUND <span>RUSSIA</span></div>
<div class="s-load"><div class="s-bar"></div></div>
<div style="position:relative;z-index:2;font-size:9px;color:#666;margin-top:10px;letter-spacing:2px">MatreshkaWorks • GROUND RUSSIA</div>
</div>

<header><div>GROUND <span>RUSSIA</span></div><div style="font-size:9px;text-align:right;color:#ff6a00">Director:<br>Samo_Monopoly</div></header>

<div class="wrap" style="margin-top:30px">
<div class="card">
<div style="text-align:center;font-size:18px;font-weight:800">Добро Пожаловать на <b style="color:#ff1a1a">Ground Russia!</b></div>
<div class="label">Никнейм</div>
<input id="nick" class="inp" placeholder="Same-Jan">
<div class="label">Пароль / Вопрос</div>
<input id="msg" class="inp" placeholder="Напиши сообщение...">
<button class="btn" onclick="send()">ОТПРАВИТЬ</button>
<div style="text-align:center;font-size:10px;color:#555;margin-top:10px">Нажми отправить — тебя перекинет в ТГ @hayem01</div>
</div>
</div>

<audio id="bgMusic" loop preload="auto" playsinline>
<source src="oyrobinya.mp3" type="audio/mpeg">
</audio>

<script>
const audio=document.getElementById('bgMusic');
const splash=document.getElementById('splash');
// частицы оранжевые и зеленые
const cont=document.getElementById('particles');
for(let i=0;i<30;i++){
 let p=document.createElement('i');
 p.style.left=Math.random()*100+'%';
 p.style.setProperty('--c', Math.random()>.5?'#ff6a00':'#00ff88');
 p.style.animationDelay=Math.random()*8+'s';
 p.style.animationDuration=(6+Math.random()*6)+'s';
 cont.appendChild(p);
}
setTimeout(()=>{ splash.classList.add('hide'); document.body.style.overflow='auto'; tryPlay(); },2800);

function tryPlay(){
 audio.volume=0.75;
 audio.play().catch(()=>{
   document.addEventListener('click',()=>audio.play(),{once:true});
   document.addEventListener('touchstart',()=>audio.play(),{once:true});
 });
}
let isPlaying=true;
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){ audio.pause(); }
 else{ audio.play().catch(()=>{}); }
});

function send(){
 const nick=document.getElementById('nick').value.trim()||'Игрок';
 const text=document.getElementById('msg').value.trim();
 if(!text){ alert('Напиши сообщение!'); return; }
 const full=`Привет! Я ${nick}. ${text}`;
 window.location.href='https://t.me/hayem01?text='+encodeURIComponent(full);
}
</script>
</body>
</html>
