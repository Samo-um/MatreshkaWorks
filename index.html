<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ground Russia</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
.header{padding:40px 20px;text-align:center;background:linear-gradient(180deg,#1a0a00,#000);min-height:100vh}
.btn{display:block;width:85%;max-width:340px;margin:12px auto;padding:16px;background:linear-gradient(90deg,#ff6a00,#ff1e00);border-radius:14px;text-align:center;color:#fff;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-size:16px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{width:90%;max-width:360px;background:#121212;border:1px solid #ff2a00;border-radius:18px;overflow:hidden;box-shadow:0 0 20px rgba(255,42,0,.3)}
.modal-head{background:linear-gradient(90deg,#ff6a00,#ff1e00);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.modal-body{padding:16px}
.modal input,.modal textarea{width:100%;background:#000;border:1px solid #333;color:#fff;border-radius:10px;padding:12px;margin:8px 0;box-sizing:border-box;font-family:inherit}
.modal textarea{min-height:130px;resize:none}
.close{cursor:pointer;font-size:22px}
.apk-box{text-align:center;padding:30px 20px}
.apk-box a{display:inline-block;margin-top:16px;padding:12px 20px;background:#fff;color:#000;border-radius:10px;text-decoration:none;font-weight:700}
.small{font-size:12px;opacity:.5;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="header">
<h1 style="letter-spacing:1px">GROUND RUSSIA</h1>
<button class="btn" onclick="openApk()">1. Скачать APK</button>
<button class="btn" onclick="openModal('Вопрос')">2. Вопрос</button>
<button class="btn" onclick="openModal('Жалоба')">3. Жалоба</button>
<button class="btn" onclick="openModal('Предложение')">4. Предложение</button>
<button class="btn" onclick="openModal('Сотрудничество')">5. Сотрудничество</button>
</div>

<!-- Модалка для вопросов -->
<div id="qBg" class="modal-bg" onclick="if(event.target==this)closeAll()">
<div class="modal">
<div class="modal-head"><span id="modalTitle">Вопрос</span><span class="close" onclick="closeAll()">×</span></div>
<div class="modal-body">
<input id="mNick" placeholder="Ваш ник, например Samo_Monopoly">
<textarea id="mText" placeholder="Здравствуйте, ваше имя ( Boz_Agarka )&#10;Имя виновника ( Agarki_Txa )&#10;Заскамил на деньги..."></textarea>
<button class="btn" onclick="sendTG()" style="width:100%;margin:12px 0 0 0">ОТПРАВИТЬ</button>
<div class="small">Отправится в t.me/groundrussia1<br>Текст скопируется автоматически</div>
</div>
</div>
</div>

<!-- Модалка APK -->
<div id="apkBg" class="modal-bg" onclick="if(event.target==this)closeAll()">
<div class="modal">
<div class="modal-head"><span>Скачать APK</span><span class="close" onclick="closeAll()">×</span></div>
<div class="apk-box">
<div style="font-size:20px;font-weight:800">APK ещё не добавлен</div>
<div style="margin-top:8px;opacity:.7;font-size:14px">Следи за новостями в канале</div>
<a href="https://t.me/groundrussia1" target="_blank">Перейти в канал</a>
</div>
</div>
</div>

<script>
const TG_LINK = "https://t.me/groundrussia1";

function openModal(type){
 document.getElementById('modalTitle').innerText = type;
 document.getElementById('qBg').classList.add('show');
}
function openApk(){
 document.getElementById('apkBg').classList.add('show');
}
function closeAll(){
 document.getElementById('qBg').classList.remove('show');
 document.getElementById('apkBg').classList.remove('show');
}

async function sendTG(){
 const txt = document.getElementById('mText').value.trim();
 const nick = document.getElementById('mNick').value.trim() || 'Player';
 const type = document.getElementById('modalTitle').innerText;
 if(!txt){ alert('Введите текст'); return; }
 const fullText = `[${type}] от ${nick}: ${txt}`;

 try {
   await navigator.clipboard.writeText(fullText);
 } catch(e) {
   const ta = document.createElement('textarea');
   ta.value = fullText;
   document.body.appendChild(ta);
   ta.select();
   document.execCommand('copy');
   document.body.removeChild(ta);
 }
 alert('Текст скопирован! Сейчас откроется канал - просто вставь его в поле Публикация');
 window.open(TG_LINK, '_blank');
 closeAll();
}
</script>
</body>
</html>
