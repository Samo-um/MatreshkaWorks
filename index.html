<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA | MatreshkaWorks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh}
header{display:flex;justify-content:space-between;padding:18px 20px;background:#000;border-bottom:1px solid #1a1a1a}
.logo{font-weight:900}.logo span{color:#ff1a1a}
.director{font-size:11px;text-align:right;color:#ff1a1a}
.container{max-width:520px;margin:0 auto;padding:24px 16px}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:22px;margin-top:20px}
h1{font-size:28px;text-align:center;margin:18px 0 6px} h1 b{color:#ff1a1a}
input{width:100%;padding:14px 16px;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:12px;color:#fff;font-size:16px}
.btn{width:100%;margin-top:12px;padding:14px;background:#ff1a1a;color:#fff;border:0;border-radius:12px;font-weight:800;cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.menu-item{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:18px;text-align:center}
.player{margin-top:16px;background:#000;border-radius:14px;padding:14px;border:1px solid #222}
audio{width:100%;margin-top:10px}
.hidden{display:none!important}
.greet{font-size:24px;text-align:center;padding:20px 0 10px}
</style>
</head>
<body>
<header>
<div class="logo">GROUND <span>RUSSIA</span></div>
<div class="director">Director:<br><b>Samo_Monopoly<br>Arsen_Samsonyan</b></div>
</header>
<div class="container">
  <div id="auth">
    <h1>MATRESHKA <b>WORKS</b></h1>
    <div class="card">
      <input id="nameInput" placeholder="Введи ник, например Same-Jan">
      <button class="btn" onclick="register()">ВОЙТИ В ИГРУ</button>
    </div>
  </div>
  <div id="main" class="hidden">
    <div class="greet">Привет, <b id="userName" style="color:#ff1a1a">Same-Jan</b>!</div>
    <div class="player">
      <div style="font-size:13px;font-weight:700">OYROBINYA • ORIGINAL</div>
      <audio id="audio" controls loop><source src="oyrobinya.mp3" type="audio/mpeg"></audio>
    </div>
    <div class="menu">
      <div class="menu-item">🎮 Играть</div>
      <div class="menu-item">👥 Братва</div>
      <div class="menu-item">🏠 Имущество</div>
      <div class="menu-item">⚙️ Настройки</div>
    </div>
    <button class="btn" style="background:#222;margin-top:16px" onclick="logout()">ВЫЙТИ</button>
  </div>
</div>
<script>
function register(){
  const v=document.getElementById('nameInput').value.trim()||'Same-Jan';
  localStorage.setItem('mw_name',v); showMain(v);
}
function showMain(name){
  document.getElementById('userName').textContent=name;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('audio').play().catch(()=>{});
}
function logout(){localStorage.removeItem('mw_name');location.reload();}
const saved=localStorage.getItem('mw_name'); if(saved) showMain(saved);
</script>
</body>
</html>
