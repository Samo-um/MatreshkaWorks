<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#07070a;color:#fff;height:100vh;overflow:hidden}
#intro{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100;transition:1s}
#intro.hide{opacity:0;pointer-events:none;transform:scale(1.5)}
#intro img{width:600px;max-width:80vw;animation:zoom 2.8s ease;filter:drop-shadow(0 0 50px #ff0028)}
@keyframes zoom{0%{transform:scale(0.1);opacity:0;filter:blur(20px)}50%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
header{position:fixed;top:0;left:0;right:0;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.85);border-bottom:1px solid #ff002822;z-index:10}
header b{letter-spacing:1px}
header div a{color:#fff;text-decoration:none;margin-left:22px;opacity:.7;transition:.2s}
header div a:hover{color:#ff0028;opacity:1}
.main{height:100vh;display:flex;align-items:center;justify-content:center;gap:70px;padding:80px 30px 30px}
.left-photo img{width:170px;height:170px;border-radius:50%;border:3px solid #ff0028;object-fit:cover;box-shadow:0 0 30px #ff002855}
.box{width:460px;background:#121214;border:1px solid #ff002840;padding:30px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.box h2{line-height:1.2;margin-bottom:20px}
.box h2 span{color:#ff0028}
.box label{font-size:13px;opacity:.6}
.box input{width:100%;padding:13px;margin:6px 0 16px;background:#09090b;border:1px solid #2a2a2a;border-radius:9px;color:#fff;outline:none}
.box input:focus{border-color:#ff0028}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#7a0000,#ff0028);border:none;border-radius:9px;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}
.tg-link{margin-top:18px;text-align:center;font-size:13px}
.tg-link a{color:#ff0028;text-decoration:none;opacity:.9}
.tg-link a:hover{text-decoration:underline}
@media(max-width:800px){.main{flex-direction:column;gap:25px}.box{width:100%;max-width:400px}}
</style>
</head>
<body>

<audio id="music" autoplay>
  <source src="oyrobinya.mp3" type="audio/mpeg">
</audio>

<div id="intro"><img src="logo.png"></div>

<header>
<b>GROUND RUSSIA</b>
<div>
<a href="https://t.me/hayem01" target="_blank">По вопросам</a>
<a href="#">Форум</a>
</div>
</header>

<div class="main">
<div class="left-photo">
<img src="logo.png" alt="logo">
</div>

<div class="box">
<h2>Добро Пожаловать на форум<br><span>Ground Russia!</span></h2>

<label>Никнейм</label>
<input type="text" placeholder="Введите ник">

<label>Пароль</label>
<input type="password" placeholder="Введите пароль">

<button class="btn">ВОЙТИ</button>

<div class="tg-link">
Связь: <a href="https://t.me/hayem01" target="_blank">@hayem01</a>
</div>
</div>
</div>

<script>
const audio = document.getElementById('music');
audio.volume = 0.18;
window.addEventListener('load', () => {
  audio.play().catch(() => {
    document.addEventListener('mousemove', () => audio.play(), {once:true});
    document.addEventListener('click', () => audio.play(), {once:true});
  });
  setTimeout(() => {
    let fade = setInterval(() => {
      if(audio.volume > 0.01){ audio.volume -= 0.01; }
      else { audio.pause(); clearInterval(fade); }
    }, 120);
  }, 7000);
});
setTimeout(()=>document.getElementById('intro').classList.add('hide'),3000);
</script>
</body>
</html>
