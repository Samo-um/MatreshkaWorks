<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#08080d;color:#fff;min-height:100vh}
#intro{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:200;transition:1s}
#intro.hide{opacity:0;pointer-events:none;transform:scale(1.5)}
#intro img{width:600px;max-width:80vw;filter:drop-shadow(0 0 60px #ff0028)}
header{position:fixed;top:0;left:0;right:0;padding:15px 30px;display:flex;justify-content:space-between;background:rgba(0,0,0,.9);border-bottom:1px solid #ff002822;z-index:10}
.main{height:100vh;display:flex;align-items:center;justify-content:center;gap:70px;padding:80px 30px 30px}
.left-photo img{width:200px;height:200px;border-radius:50%;border:3px solid #ff0028;box-shadow:0 0 40px #ff002855;object-fit:cover;background:#111;display:block}
.box{width:420px;background:#121214;border:1px solid #ff002840;padding:30px;border-radius:16px}
.box input{width:100%;padding:13px;margin:6px 0 16px;background:#09090b;border:1px solid #2a2a2a;border-radius:9px;color:#fff}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#7a0000,#ff0028);border:none;border-radius:9px;color:#fff;font-weight:800;cursor:pointer}
#menuPage{display:none;min-height:100vh;padding:90px 20px 30px}.menu-wrap{max-width:900px;margin:0 auto}.welcome{font-size:26px;margin-bottom:20px}.welcome span{color:#ff0028}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#121214;border:1px solid #ff002822;padding:28px;border-radius:18px;cursor:pointer;text-align:center;transition:.2s}
.card:hover{border-color:#ff0028;transform:translateY(-4px)}.card.apk{border-color:#ff0028;background:linear-gradient(145deg,#1a0005,#2a0010)}
.icon{font-size:36px;margin-bottom:10px}.btn-back{margin-top:25px;width:200px;padding:12px;background:#222;border:1px solid #333;border-radius:9px;color:#fff;cursor:pointer}
#chatModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;align-items:center;justify-content:center;padding:20px}
#chatModal.show{display:flex}
.chatBox{width:100%;max-width:460px;background:#121214;border:1px solid #ff0028;border-radius:18px;overflow:hidden}
.chatHead{padding:18px 20px;background:linear-gradient(90deg,#7a0000,#ff0028);display:flex;justify-content:space-between;font-weight:800}
.chatBody{padding:22px}.chatBody textarea{width:100%;height:110px;background:#09090b;border:1px solid #333;border-radius:10px;color:#fff;padding:12px;resize:none;margin:12px 0}
.chatBody input{width:100%;padding:12px;background:#09090b;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:12px}
@media(max-width:768px){.main{flex-direction:column;gap:25px}.left-photo img{width:140px;height:140px}.box{width:95%;max-width:360px}}
</style>
</head>
<body>
<audio id="music" loop autoplay><source src="oyrobinya.mp3" type="audio/mpeg"></audio>

<header><b>GROUND RUSSIA</b></header>

<label>Никнейм</label><input id="nick" placeholder="Введите ник">
<label>Пароль</label><input id="pass" type="password" placeholder="Введите пароль">
<button class="btn" onclick="login()">ВОЙТИ</button>
<div style="margin-top:15px;text-align:center;font-size:13px">Связь: <span style="color:#ff0028">@hayem01</span></div>
</div>
</div>
<div id="menuPage">
<div class="menu-wrap">
<div class="welcome">Привет, <span id="userName"></span>!</div>
<div class="grid">

<div class="card" onclick="openChat('Задать вопрос')"><div class="icon">💬</div><b>2. Задать вопрос</b></div>
<div class="card" onclick="openChat('Жалоба')"><div class="icon">🚨</div><b>3. Жалоба</b></div>
<div class="card" onclick="openChat('Запрос на обновление')"><div class="icon">🚀</div><b>4. Запрос на обновление</b></div>
</div>
<button class="btn-back" onclick="logout()">← Выйти</button>
</div>
</div>
<div id="chatModal" onclick="if(event.target==this)closeChat()">
<div class="chatBox">
<div class="chatHead"><span id="chatTitle">Чат</span><span style="cursor:pointer" onclick="closeChat()">✕</span></div>
<div class="chatBody">
<div style="background:#1a1a20;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px">Напиши сообщение — оно улетит админу в ТГ чат @hayem01</div>
<input id="chatName" placeholder="Твой ник...">
<textarea id="chatMsg" placeholder="Напиши сообщение..."></textarea>
<button class="btn" onclick="sendMsg()">ОТПРАВИТЬ В ТЕЛЕГРАМ ЧАТ</button>
</div>
</div>
</div>

  let n=document.getElementById('nick').value.trim(),p=document.getElementById('pass').value.trim();

  document.getElementById('loginPage').style.display='none';
  document.getElementById('menuPage').style.display='block';
  document.getElementById('userName').innerText=n;
  document.getElementById('chatName').value=n;

function closeChat(){document.getElementById('chatModal').classList.remove('show');}
