<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA - Forum</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black, Arial}
body{background:#000;color:#fff;overflow:hidden}
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1.3s cubic-bezier(.8,0,.2,1)}
#splash.hide{transform:translateY(-100%)}
.s-bg{position:absolute;inset:0;background:url('splash.jpg') center / cover no-repeat;animation:zoomBg 10s ease-in-out infinite alternate}
@keyframes zoomBg{0%{transform:scale(1)}100%{transform:scale(1.12)}}
.s-dark{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%, transparent 10%, rgba(0,0,0,.3) 40%, #000 85%), linear-gradient(0deg,#000 5%, transparent 40%)}
.s-glow{position:absolute;inset:0;background:radial-gradient(circle at 20% 80%, rgba(255,106,0,.35), transparent 45%), radial-gradient(circle at 80% 20%, rgba(0,255,120,.25), transparent 45%)}
.s-load{position:relative;z-index:3;margin-top:18px;width:220px;height:3px;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden}
.s-bar{height:100%;width:0%;background:linear-gradient(90deg,#ff6a00,#ff1a1a,#00ff88);box-shadow:0 0 15px #ff6a00;animation:loadBar 3.2s forwards}
@keyframes loadBar{0%{width:0}70%{width:85%}100%{width:100%}}
.s-txt{position:relative;z-index:3;margin-top:12px;font-size:10px;letter-spacing:4px;color:#aaa}
.wrap{max-width:430px;margin:0 auto;padding:0 14px 40px;position:relative;z-index:2}
header{display:flex;justify-content:space-between;padding:12px 16px;background:rgba(0,0,0,.85);border-bottom:1px solid #1a1a1a;font-size:12px;font-weight:900}
header span{color:#ff1a1a}
.card{background:linear-gradient(180deg,#171717,#0f0f0f);border:1px solid #262626;border-radius:18px;padding:22px 18px;margin-top:24px;box-shadow:0 20px 60px rgba(0,0,0,.9), 0 0 30px rgba(255,26,26,.15)}
.welcome{font-size:18px;text-align:center;line-height:1.3}.welcome b{color:#ff1a1a;text-shadow:0 0 15px #ff1a1a}
.label{font-size:10px;color:#666;margin:16px 0 6px;letter-spacing:1px}
.inp{width:100%;padding:14px;background:#080808;border:1px solid #2c2c2c;border-radius:12px;color:#fff;outline:none}
.inp:focus{border-color:#ff6a00;box-shadow:0 0 15px rgba(255,106,0,.3)}
.btn{width:100%;margin-top:20px;padding:15px;background:linear-gradient(90deg,#ff6a00,#ff1a1a);border:0;border-radius:12px;color:#fff;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 0 30px rgba(255,26,26,.5)}
.menu-btn{width:100%;padding:19px 16px;background:linear-gradient(180deg,#1d1d1d,#151515);border:1px solid #2b2b2b;border-radius:14px;margin-top:12px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:800;font-size:14px;cursor:pointer}
.menu-btn:first-child{background:linear-gradient(180deg,#2a150a,#1d0e0a);border-color:#ff3c00}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:400px;background:#151515;border:1px solid #ff1a1a;border-radius:18px;overflow:hidden}
.modal-head{background:linear-gradient(90deg,#ff6a00,#ff1a1a);padding:12px 16px;display:flex;justify-content:space-between;font-weight:900}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="splash">
<div class="s-bg"></div><div class="s-dark"></div><div class="s-glow"></div>
<div style="position:relative;z-index:3;text-align:center">
<img src="logo.png" style="width:360px;max-width:90vw;filter:drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 60px #ff6a00)">
<div class="s-load"><div class="s-bar"></div></div>
<div class="s-txt">MATRESHKA WORKS • GROUND RUSSIA</div>
</div>
</div>
<header><div>GROUND <span>RUSSIA</span></div><div style="font-size:9px;color:#ff6a00;text-align:right">Director:<br>Samo_Monopoly</div></header>
<div class="wrap">
<div id="loginBox">
<div class="card">
<div class="welcome">Добро Пожаловать на форум<br><b>Ground Russia!</b></div>
<div class="label">ПРИДУМАЙТЕ НИК</div>
<input id="nick" class="inp" placeholder="Nick_Name">
<div class="label">ПРИДУМАЙТЕ ПАРОЛЬ</div>
<input id="pass" type="password" class="inp" placeholder="••••••••">
<button class="btn" onclick="register()">ЗАРЕГИСТРИРОВАТЬСЯ</button>
</div>
</div>
<div id="menuBox" class="hidden">
<div style="font-size:22px;text-align:center;margin:20px 0 8px">Привет, <b id="uName" style="color:#ff1a1a">Игрок</b>!</div>
<div class="menu-btn" onclick="goApk()">📦 1. СКАЧАТЬ APK</div>
<div class="menu-btn" onclick="goTG('Вопрос')">💬 2. ВОПРОС</div>
<div class="menu-btn" onclick="goTG('Жалоба')">🚨 3. ЖАЛОБА</div>
<div class="menu-btn" onclick="goTG('Запрос на обновление')">🚀 4. ЗАПРОС НА ОБНОВЛЕНИЕ</div>
</div>
</div>
<div id="modalBg" class="modal-bg" onclick="if(event.target==this)closeModal()">
<div class="modal">
<div class="modal-head"><span id="modalTitle">Вопрос</span><span onclick="closeModal()">✕</span></div>
<div style="padding:16px">
<input id="mNick" class="inp" style="margin-bottom:12px">
<textarea id="mText" style="width:100%;min-height:110px;background:#080808;border:1px solid #2a2a2a;border-radius:12px;color:#fff;padding:12px" placeholder="Опишите проблему..."></textarea>
<button class="btn" onclick="sendToTG()">ОТПРАВИТЬ В ТГ @hayem01</button>
</div>
</div>
</div>
<audio id="bgMusic" loop preload="auto" playsinline>
<source src="oyrobinya.mp3" type="audio/mpeg">
</audio>
<script>
const audio=document.getElementById('bgMusic');
const splash=document.getElementById('splash');
setTimeout(()=>{splash.classList.add('hide');document.body.style.overflow='auto';playMusic();},3400);
function playMusic(){audio.volume=0.8;audio.play().catch(()=>{document.addEventListener('click',()=>audio.play(),{once:true});});}
let wasPlaying=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden){wasPlaying=!audio.paused;audio.pause();}else{if(wasPlaying){audio.play();}}});
window.addEventListener('pagehide',()=>audio.pause());
window.addEventListener('blur',()=>{if(!audio.paused){wasPlaying=true;audio.pause();}});
window.addEventListener('focus',()=>{if(wasPlaying){audio.play();wasPlaying=false;}});
function register(){
 const nick=document.getElementById('nick').value.trim();
 const pass=document.getElementById('pass').value.trim();
 if(nick.length<3){alert('Ник минимум 3 символа! Формат Nick_Name');return;}
 if(pass.length<4){alert('Пароль минимум 4 символа!');return;}
 localStorage.setItem('gr_nick',nick);
 document.getElementById('uName').textContent=nick;
 document.getElementById('mNick').value=nick;
 document.getElementById('loginBox').classList.add('hidden');
 document.getElementById('menuBox').classList.remove('hidden');
 playMusic();
}
function goApk(){window.location.href='https://t.me/hayem01?text='+encodeURIComponent('Привет! Хочу скачать APK Ground Russia');}
function goTG(type){document.getElementById('modalTitle').textContent=type;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
function sendToTG(){
 const t=document.getElementById('mText').value.trim();
 if(!t){alert('Напиши сообщение!');return;}
 const n=document.getElementById('mNick').value.trim()||'Игрок';
 const type=document.getElementById('modalTitle').textContent;
 const msg=`[${type}] от ${n}: ${t}`;
 window.location.href='https://t.me/hayem01?text='+encodeURIComponent(msg);
}
</script>
</body>
 </html>
