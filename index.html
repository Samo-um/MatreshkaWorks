<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:radial-gradient(ellipse at top,#1a0a0f,#08080d);color:#fff;min-height:100vh}
#intro{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:100;transition:.7s}
#intro.hide{opacity:0;pointer-events:none}
#intro img{width:500px;max-width:80vw;filter:drop-shadow(0 0 50px #ff0028)}
header{position:fixed;top:0;left:0;right:0;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.9);border-bottom:1px solid #ff002822;z-index:10}
.logo{font-weight:900} .logo span{color:#ff0028}
.dir{font-size:11px;opacity:.8;text-align:right} .dir b{color:#ff0028}
.main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px 20px;gap:18px}
.photo img{width:170px;height:170px;border-radius:50%;border:3px solid #ff0028;box-shadow:0 0 40px #ff0028;object-fit:cover}
.box{width:100%;max-width:380px;background:#14141a;border:1px solid #ff002830;padding:26px;border-radius:18px}
.box h2{text-align:center;margin-bottom:18px;font-size:20px} .box h2 span{color:#ff0028}
.box input{width:100%;padding:13px;margin-bottom:14px;background:#08080a;border:1px solid #2a2a30;border-radius:10px;color:#fff;outline:none}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#7a0000,#ff0028);border:none;border-radius:10px;color:#fff;font-weight:900}
#menu{display:none;min-height:100vh;padding-top:100px;text-align:center;font-size:24px}
</style>
</head>
<body>

<audio id="music" src="oyrobinya.mp3" loop preload="auto" playsinline></audio>

<div id="intro"><img src="logo.png"></div>

<header>
<div class="logo">GROUND <span>RUSSIA</span></div>
<div class="dir">Director:<br><b>Samo_Monopoly</b><br><b>Arsen_Samsonyan</b></div>
</header>

<div class="main" id="loginPage">
<div class="photo"><img src="logo.png"></div>
<div class="box">
<h2>Добро Пожаловать на форум<br><span>Ground Russia!</span></h2>
<input id="nick" placeholder="Никнейм">
<input id="pass" type="password" placeholder="Пароль">
<button class="btn" onclick="login()">ВОЙТИ</button>
</div>
</div>

<div id="menu">Привет, <b id="uName" style="color:#ff0028"></b>!</div>

<script>
const audio = document.getElementById('music');
audio.volume = 0.4;
let played = false;

function playAudio(){
  if(played) return;
  audio.play().then(()=>{played=true}).catch(()=>{});
}
function pauseAudio(){
  audio.pause();
  played = false;
}

window.addEventListener('load', ()=>{
  setTimeout(()=>document.getElementById('intro').classList.add('hide'), 2000);
  playAudio();
  document.body.addEventListener('click', playAudio, {once:true});
});

// === ФИКС ДЛЯ СВОРАЧИВАНИЯ - ТЕПЕРЬ 100% СТОПАЕТ ===
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    pauseAudio();
  }else{
    playAudio();
  }
});

window.addEventListener('blur', pauseAudio);
window.addEventListener('pagehide', pauseAudio);
window.addEventListener('freeze', pauseAudio);
document.addEventListener('resume', playAudio);

function login(){
  let n=document.getElementById('nick').value.trim();
  if(!n){alert('Введи ник');return}
  document.getElementById('loginPage').style.display='none';
  document.getElementById('menu').style.display='block';
  document.getElementById('uName').innerText=n;
}
</script>
</body>
</html>
