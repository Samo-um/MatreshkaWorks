<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROUND RUSSIA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black, Arial}
body{background:#000;color:#fff;overflow:hidden}
#splash{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1.4s cubic-bezier(.8,0,.2,1)}
#splash.hide{transform:translateY(-100%)}
.s-bg{position:absolute;inset:0;background:url('splash.jpg') center / cover no-repeat;animation:sZoom 12s ease-in-out infinite alternate, sKen 3s ease-out}
@keyframes sZoom{0%{transform:scale(1)}100%{transform:scale(1.15)}}
@keyframes sKen{0%{filter:brightness(.3) blur(20px)}100%{filter:brightness(1) blur(0)}}
.s-dark{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%, transparent 5%, rgba(0,0,0,.2) 40%, #000 88%), linear-gradient(0deg,#000 0%, transparent 50%)}
.s-glow{position:absolute;inset:0;background:radial-gradient(circle at 20% 80%, rgba(255,106,0,.45), transparent 50%), radial-gradient(circle at 80% 20%, rgba(0,255,120,.3), transparent 50%);animation:glowPulse 3s infinite alternate}
@keyframes glowPulse{0%{opacity:.6}100%{opacity:1}}
.s-logo{position:relative;z-index:3;width:380px;max-width:92vw;animation:logoUltra 1.8s cubic-bezier(.18,1.6,.6,1) forwards, float 3s 1.8s ease-in-out infinite}
@keyframes logoUltra{0%{transform:translateY(500px) scale(.1) rotate(-20deg);opacity:0;filter:blur(40px) brightness(0)}60%{transform:translateY(-20px) scale(1.1) rotate(5deg);opacity:1;filter:blur(0) brightness(1.3)}100%{transform:translateY(0) scale(1) rotate(0);opacity:1;filter:drop-shadow(0 0 25px #ff0000) drop-shadow(0 0 70px #ff6a00)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.s-bar-wrap{position:relative;z-index:3;margin-top:20px;width:240px;height:3px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden}
.s-bar{height:100%;width:0;background:linear-gradient(90deg,#ff6a00,#ff1a1a,#00ff88);box-shadow:0 0 20px #ff6a00;animation:load 3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes load{0%{width:0}60%{width:80%}100%{width:100%}}
.s-title{position:relative;z-index:3;margin-top:14px;font-size:11px;letter-spacing:5px;color:#fff;opacity:0;animation:fadeIn .8s 1.2s forwards}
@keyframes fadeIn{to{opacity:.8}}
/* HEADER WITH CREATOR */
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(0,0,0,.85);border-bottom:1px solid #1a1a1a;backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.h-left{font-size:13px;font-weight:900}.h-left span{color:#ff1a1a;text-shadow:0 0 10px #ff1a1a}
.h-right{text-align:right;line-height:1.1;font-size:9px;font-weight:800;letter-spacing:.5px}
.h-right .c{color:#00ff88;text-shadow:0 0 8px #00ff88}.h-right .d{color:#ff6a00;text-shadow:0 0 8px #ff6a00}
.wrap{max-width:430px;margin:0 auto;padding:0 14px 40px}
.card{background:linear-gradient(180deg,#191919,#0e0e0e);border:1px solid #2a2a2a;border-radius:18px;padding:22px;margin-top:20px;box-shadow:0 20px 60px rgba(0,0,0,.9), 0 0 30px rgba(255,26,26,.12);animation:cardIn .9s ease}
@keyframes cardIn{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.welcome{text-align:center;font-size:19px}.welcome b{color:#ff1a1a}
.label{font-size:10px;color:#666;margin:16px 0 6px;letter-spacing:1px}
.inp{width:100%;padding:14px;background:#080808;border:1px solid #2c2c2c;border-radius:12px;color:#fff;outline:none}
.inp:focus{border-color:#ff6a00;box-shadow:0 0 15px rgba(255,106,0,.3)}
.btn{width:100%;margin-top:20px;padding:15px;background:linear-gradient(90deg,#ff6a00,#ff1a1a);border:0;border-radius:12px;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 0 30px rgba(255,26,26,.5)}
.menu-btn{width:100%;padding:18px;background:linear-gradient(180deg,#1d1d1d,#151515);border:1px solid #2b2b2b;border-radius:14px;margin-top:12px;font-weight:800;cursor:pointer;display:flex;gap:10px;align-items:center}
.menu-btn:first-child{border-color:#ff3c00;box-shadow:0 0 20px rgba(255,60,0,.2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}
.modal-bg.show{display:flex}
.modal{width:100%;max-width:400px;background:#151515;border:1px solid #ff1a1a;border-radius:18px;overflow:hidden}
.modal-head{background:linear-gradient(90deg,#ff6a00,#ff1a1a);padding:12px 16px;display:flex;justify-content:space-between;font-weight:900}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="splash">
<div class="s-bg"></div><div class="s-dark"></div><div class="s-glow"></div>
<img src="logo.png" class="s-logo">
<div class="s-bar-wrap"><div class="s-bar"></div></div>
<div class="s-title">GROUND RUSSIA • MATRESHKA WORKS</div>
</div>

<header>
<div class="h-left">GROUND <span>RUSSIA</span></div>
<div class="h-right">
<div class="c">Создатель: Arsen_Samsonyan</div>
<div class="d" style="margin-top:3px">Director: Samo_Monopoly</div>
</div>
</header>

<div class="wrap">
<div id="loginBox">
<div class="card">
<div class="welcome">Добро Пожаловать на форум<br><b>Ground Russia!</b></div>
<div class="label">ПРИДУМАЙТЕ НИК</div>
<input id="nick" class="inp" placeholder="Nick_Name">
<div class="label">ПРИДУМАЙТЕ ПАРОЛЬ</div>
<input id="pass" type="password" class="inp" placeholder="••••••••">
<button class="btn" onclick="register()">ЗАРЕГИСТРИРОВАТЬСЯ</button>
</div>
</div>

<div id="menuBox" class="hidden">
<div style="text-align:center;margin:18px 0">Привет, <b id="uName" style="color:#ff1a1a">Игрок</b>!</div>
<div class="menu-btn" onclick="location.href='https://t.me/hayem01?text=Хочу APK Ground Russia'">📦 1. СКАЧАТЬ APK</div>
<div class="menu-btn" onclick="goTG('Вопрос')">💬 2. ВОПРОС</div>
<div class="menu-btn" onclick="goTG('Жалоба')">🚨 3. ЖАЛОБА</div>
<div class="menu-btn" onclick="goTG('Запрос на обновление')">🚀 4. ЗАПРОС НА ОБНОВЛЕНИЕ</div>
</div>
</div>

<div id="modalBg" class="modal-bg" onclick="if(event.target==this)closeModal()">
<div class="modal">
<div class="modal-head"><span id="modalTitle">Вопрос</span><span onclick="closeModal()">✕</span></div>
<div style="padding:16px">
<input id="mNick" class="inp" style="margin-bottom:12px">
<textarea id="mText" style="width:100%;min-height:110px;background:#080808;border:1px solid #2a2a2a;border-radius:12px;color:#fff;padding:12px" placeholder="Ваше сообщение..."></textarea>
<button class="btn" onclick="sendToTG()">ОТПРАВИТЬ @hayem01</button>
</div>
</div>
</div>

<audio id="bgMusic" loop preload="auto" playsinline><source src="oyrobinya.mp3" type="audio/mpeg"></audio>

<script>
const audio=document.getElementById('bgMusic'), splash=document.getElementById('splash');
setTimeout(()=>{splash.classList.add('hide');document.body.style.overflow='auto';audio.volume=0.8;audio.play().catch(()=>{document.addEventListener('click',()=>audio.play(),{once:true})});},3500);
let wasPlaying=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden){wasPlaying=!audio.paused;audio.pause();}else if(wasPlaying){audio.play();}});
window.addEventListener('blur',()=>{if(!audio.paused){wasPlaying=true;audio.pause();}});
window.addEventListener('focus',()=>{if(wasPlaying){audio.play();wasPlaying=false;}});
function register(){
 const n=document.getElementById('nick').value.trim(), p=document.getElementById('pass').value.trim();
 if(n.length<3||p.length<4){alert('Ник Nick_Name минимум 3 символа, пароль 4');return;}
 localStorage.setItem('gr_nick',n);document.getElementById('uName').textContent=n;document.getElementById('mNick').value=n;
 document.getElementById('loginBox').classList.add('hidden');document.getElementById('menuBox').classList.remove('hidden');
}
function goTG(t){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
function sendToTG(){
 const txt=document.getElementById('mText').value.trim(); if(!txt){alert('Напиши!');return;}
 const n=document.getElementById('mNick').value.trim()||'Игрок', type=document.getElementById('modalTitle').textContent;
 location.href='https://t.me/hayem01?text='+encodeURIComponent(`[${type}] от ${n}: ${txt}`);
}
</script>
</body>
</html>
