          python3 -c "
          from PIL import Image
          try:
            im=Image.open('IMG-20261017-WA1305.jpg')
            im=im.resize((192,192))
          except:
            im=Image.new('RGB',(192,192),(212,175,55))
          im.save('ic.png')
          im.resize((512,512)).save('lg.png')
          " || pip install Pillow && python3 -c "from PIL import Image; Image.new('RGB',(192,192),(212,175,55)).save('ic.png'); Image.new('RGB',(512,512),(212,175,55)).save('lg.png')"
