 name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f *.zip ]; then unzip -o *.zip; fi
          if [ -f MatreshkaWorks.zip ]; then unzip -o MatreshkaWorks.zip; fi
          ls -la

      - name: Set app name to MATRESHKA RP WORKS
        run: |
          find . -name "strings.xml" -exec sed -i 's/>.*</>MATRESHKA RP WORKS</g' {} \; || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup icons
        run: |
          echo "Setting up icons..."
          ls -la || true

      - name: Build APK
        run: |
          cd android || cd MATRESHKARP_WORKS/android || cd MatreshkaWorks/android || true
          pwd
          ls -la
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          cd ../..
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRESHKA-RP-WORKS-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: error
