name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: |
          rm -rf app
          mkdir -p app/src/main/java/com/matreshka
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          printf "buildscript{repositories{google();mavenCentral()}dependencies{classpath 'com.android.tools.build:gradle:8.1.0'}}\nallprojects{repositories{google();mavenCentral()}}\n" > build.gradle
          printf "plugins{id 'com.android.application'}\nandroid{namespace 'com.matreshka';compileSdk 34;defaultConfig{applicationId 'com.matreshka';minSdk 21;targetSdk 34;versionCode 6;versionName '6.0-FINAL'}\nbuildTypes{release{minifyEnabled false};debug{minifyEnabled false}}}\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="MATRESHKA BY DOMINIC"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">MATRESHKA TOP</string></resources>' > app/src/main/res/values/strings.xml
          cat > app/src/main/java/com/matreshka/MainActivity.java <<'JAVA'
          package com.matreshka;
          import android.app.Activity; import android.os.Bundle; import android.widget.*; import android.view.View; import android.app.AlertDialog; import android.content.DialogInterface; import android.content.Intent; import android.net.Uri; import android.graphics.Color; import android.view.Gravity; import android.graphics.Typeface;
          public class MainActivity extends Activity {
          protected void onCreate(Bundle b){super.onCreate(b);
          String[] titles={"1. Перепродажа оружия","2. Продажа одежды","3. Скрытие авто","4. Строительный бизнес","5. Таксист","6. Барыга","7. Директор стройки","8. Карты и рейды"};
          String[] prices={"15.000 + 10.000 в день","20.000 + 10.000 в день","20.000 зарплата","75.000 +10.000/рейс","5.000 +5.000/рейс","Начать 200.000 / ЗП 100.000","Начать 700.000 / ЗП 276.000","45.000 оплата"};
          String[] emojis={"🔫","🧥","🚘","🚚","🚖","💎","🏢","⭐"};
          LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setBackgroundColor(Color.WHITE); root.setPadding(20,20,20,20);
          TextView logo=new TextView(this); logo.setText("MATRESHKA\nWORKS\nBY DOMINIC"); logo.setTextSize(24); logo.setTypeface(null, Typeface.BOLD); logo.setTextColor(Color.WHITE); logo.setBackgroundColor(Color.BLACK); logo.setGravity(Gravity.CENTER); logo.setPadding(30,35,30,35); root.addView(logo);
          TextView sub=new TextView(this); sub.setText("ПРАЙС-ЛИСТ РАБОТ (27 SRV)"); sub.setGravity(Gravity.CENTER); sub.setPadding(0,20,0,10); sub.setTypeface(null, Typeface.BOLD); sub.setTextSize(16); root.addView(sub);
          for(int i=0;i<titles.length;i++){final int idx=i;
          Button btn=new Button(this); btn.setText(emojis[idx]+" "+titles[idx]+" - "+prices[idx]); btn.setTextColor(Color.WHITE); btn.setBackgroundColor(Color.BLACK); btn.setAllCaps(false); btn.setTextSize(12); LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2); p.setMargins(0,10,0,10); btn.setLayoutParams(p);
          btn.setOnClickListener(new View.OnClickListener(){public void onClick(View v){
          AlertDialog.Builder bu=new AlertDialog.Builder(MainActivity.this);
          bu.setTitle(emojis[idx]+" "+titles[idx]);
          bu.setMessage("💵 "+prices[idx]+"\n\nПосле подтверждения ты перейдешь в чат с Dominic (+374 91 061282) и он назначит место встречи в игре 27 SRV!");
          bu.setPositiveButton("✅ ПОДТВЕРДИТЬ", new DialogInterface.OnClickListener(){public void onClick(DialogInterface d,int w){
          String msg="Привет Dominic! Хочу работу: "+titles[idx]+" - "+prices[idx]+". Назначь встречу в игре 27 SRV!";
          Intent it=new Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/37491061282?text="+Uri.encode(msg)));
          try{startActivity(it);}catch(Exception e){Toast.makeText(MainActivity.this, "Напиши Dominic в WhatsApp", Toast.LENGTH_SHORT).show();}
          }});
          bu.setNegativeButton("Закрыть", null); bu.show();
          }}); root.addView(btn);}
          Button boss=new Button(this); boss.setText("🔴 СВЯЗЬ С ДИРЕКТОРОМ DOMINIC"); boss.setTextColor(Color.WHITE); boss.setBackgroundColor(Color.RED); boss.setTypeface(null, Typeface.BOLD); boss.setPadding(20,40,20,40); LinearLayout.LayoutParams pb=new LinearLayout.LayoutParams(-1,-2); pb.setMargins(0,30,0,10); boss.setLayoutParams(pb); boss.setOnClickListener(new View.OnClickListener(){public void onClick(View v){Intent it=new Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/37491061282?text=Привет%20Dominic!%20Связь%20с%20директором%20MATRESHKA%20WORKS")); try{startActivity(it);}catch(Exception e){}}}); root.addView(boss);
          ScrollView sv=new ScrollView(this); sv.addView(root); setContentView(sv);
          }
          }
          JAVA
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MATRESHKA-6-FINAL-DOMINIC
          path: app/build/outputs/apk/debug/app-debug.apk
