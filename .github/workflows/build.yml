name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DIAGNOSTIC
        run: |
          echo "=== KOREN ==="
          ls -la
          echo "=== ANDROID ==="
          ls -la android || echo "net android"
          echo "=== GRADLEW ==="
          cat gradlew
          echo "=== FIND BUILD GRADLE ==="
          find . -maxdepth 4 -name "*.gradle*" | head -20
