name: MATRESHKA FINAL TOP
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build Final App
        run: |
          pip install Pillow -q
          python3 << 'PY'
          from PIL import Image
          im=Image.open('IMG-20261017-WA1305.jpg').convert('RGBA')
          w,h=im.size; s=min(w,h)
          im=im.crop(((w-s)//2,(h-s)//2,(w+s)//2,(h+s)//2))
          im.resize((192,192), Image.LANCZOS).save('ic.png')
          im.resize((512,512), Image.LANCZOS).save('lg.png')
          PY
          rm -rf app build
          mkdir -p app/src/main/java/com/matreshka app/src/main/res/values app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable
          echo "include ':app'" > settings.gradle
          printf "plugins { id 'com.android.application' }\nandroid { namespace 'com.matreshka'; compileSdk 34; defaultConfig { applicationId 'com.matreshka.works.final'; minSdk 21; targetSdk 34; versionCode 27; versionName 'FINAL-RU' } }\n" > app/build.gradle
