name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Find and Build
        run: |
          echo "Ищу gradlew..."
          find . -type f -name gradlew | head -20
          GRADLE=$(find . -type f -name gradlew | head -1)
          echo "Нашел: $GRADLE"
          chmod +x $GRADLE
          DIR=$(dirname $GRADLE)
          echo "Папка: $DIR"
          cd $DIR
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRESHKA-APK
          path: '**/*.apk'
