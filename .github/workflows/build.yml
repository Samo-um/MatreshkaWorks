 name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Find and Build
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -type f | head -1)
          echo "Found gradlew at: $GRADLE_PATH"
          DIR=$(dirname "$GRADLE_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
          ./gradlew app:assembleDebug --no-daemon || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRESHKA-RP-WORKS-APK
          path: |
            **/*.apk
          if-no-files-found: error
