          printf '<resources><string name="app_name">MATRESHKA WORKS 27</string></resources>' > app/src/main/res/values/strings.xml
          cp ic.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp lg.png app/src/main/res/drawable/logo.png
