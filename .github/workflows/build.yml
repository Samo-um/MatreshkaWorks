name: Build Matreshka Chat
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - uses: gradle/actions/setup-gradle@v4
      
      - name: Build APK
        run: |
          unzip -o MATRESHKARP_WORKS_COMPLETE_NEW-2.zip -d app_src
          cd app_src
          # Ищем где лежит настоящий проект
          REAL=$(find . -type f -name "gradlew" | head -1)
          if [ -z "$REAL" ]; then
            echo "gradlew не найден, ищу build.gradle"
            find . -type f -name "build.gradle*" | head -20
            exit 1
          fi
          DIR=$(dirname $REAL)
          echo "Собираю из: $DIR"
          cd $DIR
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matreshka-Chat-APK
