name: MATRESHKA WORKS BY DOMINIC
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-disabled: true
      - name: Build APK FINAL
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/matreshka app/src/main/res/values
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.matreshka'
            compileSdk 34
            defaultConfig {
              applicationId 'com.matreshka'
              minSdk 21
              targetSdk 34
              versionCode 18
              versionName 'DOMINIC-FINAL'
            }
            buildTypes {
              release { minifyEnabled false }
              debug { minifyEnabled false }
            }
          }
          GRADLE
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="MATRESHKA WORKS"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">MATRESHKA WORKS BY DOMINIC</string></resources>' > app/src/main/res/values/strings.xml
          cat > app/src/main/java/com/matreshka/MainActivity.java <<'JAVA'
          package com.matreshka;
          import android.app.Activity; import android.os.Bundle; import android.widget.*; import android.graphics.Color; import android.view.Gravity;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              ScrollView sv=new ScrollView(this);
              LinearLayout root=new LinearLayout(this);
              root.setOrientation(1);
              root.setPadding(20,20,20,20);
              root.setBackgroundColor(Color.WHITE);
              TextView logo=new TextView(this);
              logo.setText("MATRESHKA WORKS\nBY DOMINIC\n\n27 SRV ONLINE\nBONUS +50%");
              logo.setTextColor(Color.WHITE);
              logo.setBackgroundColor(Color.BLACK);
              logo.setGravity(Gravity.CENTER);
              logo.setPadding(30,30,30,30);
              root.addView(logo);
              String[] jobs={"[HOT] Perprodazha oruzhiya - 15k +10k/den"," [NEW] Prodazha odezhdy - 20k +10k/den"," [FIRE] Skrytie avto - 20k"," [MONEY] Stroy biznes - 75k +10k/reys"," [EASY] Taksist - 5k +5k/reys"," [VIP] Baryga - Start 200k ZP 100k"," [TOP] Direktor stroyki - Start 700k ZP 276k"," [RAID] Karty i reydy - 45k"};
              for(String job: jobs){
                Button btn=new Button(this);
                btn.setText(job);
                btn.setTextColor(Color.WHITE);
                btn.setBackgroundColor(Color.BLACK);
                btn.setAllCaps(false);
                LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);
                p.setMargins(0,15,0,15);
                btn.setLayoutParams(p);
                root.addView(btn);
              }
              Button boss=new Button(this);
              boss.setText("SVYAZ S DIREKTOROM DOMINIC");
              boss.setTextColor(Color.WHITE);
              boss.setBackgroundColor(Color.RED);
              root.addView(boss);
              sv.addView(root);
              setContentView(sv);
            }
          }
          JAVA
          gradle :app:assembleDebug --rerun-tasks --stacktrace
          echo "=== POISK APK ==="
          find . -name "*.apk" -type f
          ls -lh app/build/outputs/apk/debug/ || ls -R app/build/
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MATRESHKA-WORKS-BY-DOMINIC-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/
            **/*.apk
