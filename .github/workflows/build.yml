name: build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/matreshka
          mkdir -p app/src/main/res/layout
          echo 'include ":app"' > settings.gradle
          echo 'buildscript{repositories{google();mavenCentral()}dependencies{classpath "com.android.tools.build:gradle:7.4.2"}}allprojects{repositories{google();mavenCentral()}}' > build.gradle
          echo 'apply plugin:"com.android.application" android{namespace "com.matreshka";compileSdk 33;defaultConfig{applicationId "com.matreshka";minSdk 21;targetSdk 33}}' > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo '<TextView xmlns:android="http://schemas.android.com/apk/res/android" android:text="MATRESHKA WORKS" android:layout_width="match_parent" android:layout_height="match_parent" />' > app/src/main/res/layout/activity_main.xml
          echo 'package com.matreshka; import android.app.Activity; import android.os.Bundle; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); } }' > app/src/main/java/com/matreshka/MainActivity.java
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/app-debug.apk
